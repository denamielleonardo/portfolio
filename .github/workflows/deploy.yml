name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: |
          npx ng build --configuration production --output-path docs --base-href "/portfolio/"

      - name: Add .nojekyll
        run: |
          touch docs/.nojekyll

      - name: Commit all changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f docs
          git commit -m "Auto deploy (CI/CD)" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push